---
name: CI

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    # Nightly, for the tier that needs rosdep and network access.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install nightly toolchain (for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/Cargo.lock') }}

      - name: Check formatting
        working-directory: packages
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        working-directory: packages
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        working-directory: packages
        run: cargo +stable test --workspace

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Advisories, licences, wildcard dependencies and registry sources.
      # Policy lives in packages/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/Cargo.toml
          command: check

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # test_build.py drives a real cargo build and skips without a toolchain.
      # Without this it skipped here and ran only in the release workflow, which
      # is where it failed -- after a tag had been pushed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: 'true'
          working-directory: packages/colcon-cargo-ros2

      - name: Install wheel and test dependencies
        run: |
          pip install packages/colcon-cargo-ros2/dist/*.whl
          pip install pytest ruff colcon-core colcon-library-path colcon-ros

      - name: Run ruff lint
        working-directory: packages/colcon-cargo-ros2
        run: ruff check colcon_cargo_ros2/ test/

      - name: Run pytest
        run: pytest packages/colcon-cargo-ros2/test/ -v

  workspaces:
    name: Testing Workspaces (base tier)
    runs-on: ubuntu-latest
    # Everything the base tier needs ships in this image: no rosdep, no network
    # access to third-party interface packages.
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-workspaces-cargo-${{ hashFiles('packages/Cargo.lock') }}

      # ros:humble-ros-base carries no pip at all -- not the command, not the
      # module. Its Python packages come from apt, which is how ROS expects to
      # be assembled: 23 python3-colcon-* including common-extensions, empy
      # 3.3.4, lark, all in /usr/lib/python3/dist-packages. Installing pip from
      # apt keeps that arrangement intact -- pip then sees the apt colcon and
      # empy as already satisfying the wheel's requirements and replaces
      # neither. Verified in the image: empy stays 3.3.4 from dist-packages and
      # `colcon build --packages-select` still parses.
      - name: Install pip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip

      - name: Build and install wheel
        run: |
          pip install maturin
          cd packages/colcon-cargo-ros2
          maturin build --release --out dist
          pip install dist/*.whl

      # interfaces: every IDL shape, asserted at runtime by its consumers.
      # layouts:    every workspace shape, asserted against the generated config.
      # scenarios:  the failure modes, asserted against the messages they produce.
      - name: Build and verify the workspaces
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          just test-workspaces

  workspaces-heavy:
    name: Testing Workspaces (heavy tier)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    # Not on every pull request: this one installs third-party interface
    # packages with rosdep and clones the upstream examples, so it needs network
    # access and several minutes. Nightly, on demand, or by labelling a pull
    # request `heavy`.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'heavy')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-workspaces-heavy-cargo-${{ hashFiles('packages/Cargo.lock') }}

      # ros:humble-ros-base carries no pip at all -- not the command, not the
      # module. Its Python packages come from apt, which is how ROS expects to
      # be assembled: 23 python3-colcon-* including common-extensions, empy
      # 3.3.4, lark, all in /usr/lib/python3/dist-packages. Installing pip from
      # apt keeps that arrangement intact -- pip then sees the apt colcon and
      # empy as already satisfying the wheel's requirements and replaces
      # neither. Verified in the image: empy stays 3.3.4 from dist-packages and
      # `colcon build --packages-select` still parses.
      - name: Install pip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip

      - name: Build and install wheel
        run: |
          pip install maturin
          cd packages/colcon-cargo-ros2
          maturin build --release --out dist
          pip install dist/*.whl

      # test_msgs and nav2_msgs are not in a stock image; the base tier is
      # deliberately built so that it never needs this step. The recipe covers
      # interfaces/heavy as well as the base sources.
      - name: Install third-party interface packages
        run: |
          apt-get update
          just install-test-deps

      - name: Build and verify every tier
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          just test-workspaces-heavy
