# Supply-chain policy for the Rust workspace, checked by `cargo deny check`.
#
# Run it with `just audit`, or let CI do it on every pull request.

[graph]
# The wheels ship for Linux, macOS and Windows; check what those actually pull.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Anything RustSec reports is an error. There are no exceptions today, and
# adding one should require writing down why here.
yanked = "deny"
ignore = []

[licenses]
# Every licence in the current tree, all permissive and compatible with this
# project's Apache-2.0. A dependency arriving under anything else should fail
# the check and be a decision, not a surprise.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are usually not ours to fix -- they come from transitive
# dependencies pinning different majors -- so they are worth seeing, not worth
# failing on.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
